services:
  spark-master:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8090:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark/data
      - ./output:/opt/spark/output

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    ports:
      - "8091:8081"
    volumes:
      - ./data:/opt/spark/data
      - ./output:/opt/spark/output

  spark-submit:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-submit
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ./data:/opt/spark/data
      - ./output:/opt/spark/output
      - ./target/pirsbd-lab4.jar:/opt/spark/apps/pirsbd-lab4.jar
    command: [
      "/opt/spark/bin/spark-submit",
      "--master", "spark://spark-master:7077",
      "--class", "org.example.NbaApp",
      "/opt/spark/apps/pirsbd-lab4.jar",
      "/opt/spark/data/players.csv",
      "/opt/spark/data/salaries_1985to2018.csv",
      "/opt/spark/data/Seasons_Stats.csv",
      "/opt/spark/output",
      "5"
    ]
